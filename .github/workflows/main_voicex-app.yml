name: Build and deploy Node.js app to Azure Web App - voicex-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies & Build Standalone
        run: |
          npm install
          npx prisma generate --schema=packages/db/prisma/schema.prisma
          npm run build
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public || true
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static || true
        env:
          SKIP_ENV_VALIDATION: 'true'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1675F4B7B7AE4ADDA07EF6FDC0B1FCDF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FEDE5B81628E4697A8E1DD3F60AC4746 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EE462224F94342CD885098EAB6939BFA }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'voicex-app'
          slot-name: 'Production'
          package: .
